# ~/.config/neofetch/config.conf
# Requires: kitty terminal + a Nerd Font (e.g. JetBrainsMono Nerd Font)

print_info() {
    local g=$'\e[38;5;245m'   # gray (box lines)
    local w=$'\e[38;5;223m'   # cream (headers)
    local p=$'\e[38;5;132m'   # pink (icons)

    prin "\n"
    prin "${g}┌──────────  ${w}Hardware Information${g}  ──────────┐"
    prin "\n"
    info "${p}󰻠 " cpu
    info "${p}󰍛 " memory
    info "${p}󰍹 " resolution
    prin "\n"
    prin "${g}├──────────  ${w}Software Information${g}  ──────────┤"
    prin "\n"
    prin "${p}󰀄 " "$USER"
    info "${p}󰣇 " distro
    info "${p}󰌽 " kernel
    info "${p}󰖲 " wm
    info "${p}󰆍 " shell
    info "${p} " term
    info "${p}󰏖 " packages
    info "${p}󰖩 " local_ip
    prin "\n"
    prin "\e[38;5;220m󰮯 ${g}• • •  \e[38;5;196m󰊠 \e[38;5;212m󰊠 \e[38;5;79m󰊠 \e[38;5;81m󰊠 \e[38;5;222m󰊠 "
    prin "\n"
    prin "\e[38;5;245m●  \e[38;5;160m●  \e[38;5;100m●  \e[38;5;172m●  \e[38;5;66m●  \e[38;5;132m●  \e[38;5;108m●  \e[38;5;223m●"
}

# Title
title_fqdn="off"

# Kernel
kernel_shorthand="on"

# Distro
distro_shorthand="off"
os_arch="off"

# Uptime / Packages / Shell
package_managers="on"
shell_path="off"
shell_version="on"

# CPU
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="off"
cpu_cores="logical"
cpu_temp="off"

# Memory
memory_percent="on"
memory_unit="mib"

# Resolution
refresh_rate="off"

# Text formatting
colors=(5 5 5 7 5 7)
bold="off"
underline_enabled="off"
underline_char="-"
separator="  →"

# Image (kitty backend)
image_backend="ascii"
image_source="$HOME/.config/neofetch/customascii.txt"
ascii_colors=(5 5 5 7 5 7)
ascii_bold="off"
gap=3
image_size="280px"
image_loop="off"
crop_mode="normal"
crop_offset="center"
yoffset=0
xoffset=0
gap=3
background_color=

# Misc
stdout="off"
